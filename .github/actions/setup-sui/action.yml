name: Set up Sui
description: Install the latest sui CLI with suiup, and cache Move dependencies.

runs:
  using: composite
  steps:
    - name: Install suiup and the latest sui
      shell: bash
      env:
        # suiup calls the GitHub API, which rate-limits anonymous requests.
        GITHUB_TOKEN: ${{ github.token }}
        SUIUP_DISABLE_UPDATE_WARNINGS: "1"
      run: |
        curl -sSfL https://raw.githubusercontent.com/Mystenlabs/suiup/main/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/suiup" install sui
        "$HOME/.local/bin/sui" --version

    # The framework and other git dependencies that the Move.lock files pin.
    - name: Cache Move dependencies
      uses: actions/cache@v4
      with:
        path: ~/.move
        key: move-${{ runner.os }}-${{ hashFiles('**/Move.lock') }}
        restore-keys: move-${{ runner.os }}-
